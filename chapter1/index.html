};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

// POST COMMENT
window.postComment = async function() {
    let name = document.getElementById("nameInput").value.trim();
    let text = document.getElementById("commentInput").value.trim();

    if (!name || !text) return;

    await addDoc(collection(db, "comments", chapterId, "messages"), {
        name: name,
        text: text,
        timestamp: Date.now()
    });

    document.getElementById("commentInput").value = "";
    loadComments();
}

// LOAD COMMENTS
async function loadComments() {
    let q = query(
        collection(db, "comments", chapterId, "messages"),
        orderBy("timestamp", "desc")
    );

    let snapshot = await getDocs(q);

    let container = document.getElementById("commentsList");
    container.innerHTML = "";

    snapshot.forEach(doc => {
        let c = doc.data();

        let date = new Date(c.timestamp).toLocaleString();

        let div = document.createElement("div");
        div.className = "comment";
        div.innerHTML = `
            <b>${c.name}</b>
            <span class="date">(${date})</span>
            <br>
            ${c.text}
        `;

        container.appendChild(div);
    });
}
