<script>
function getNext25th5PM() {
    let now = new Date();
    let target = new Date(
        now.getFullYear(),
        now.getMonth(),
        25,
        17, 0, 0, 0
    );

    // If it's already past the 25th at 5:00 PM,
    // move the target to next month's 25th.
    if (now >= target) {
        target = new Date(
            now.getFullYear(),
            now.getMonth() + 1,
            25,
            17, 0, 0, 0
        );
    }

    return target;
}

function updateCountdown() {
    let now = new Date();
    let target = getNext25th5PM();
    let diff = target - now;

    let days = Math.floor(diff / (1000 * 60 * 60 * 24));
    let hours = Math.floor((diff / (1000 * 60 * 60)) % 24);
    let minutes = Math.floor((diff / (1000 * 60)) % 60);
    let seconds = Math.floor((diff / 1000) % 60);

    document.getElementById("countdown").innerText =
        days + "d " + hours + "h " + minutes + "m " + seconds + "s";
}

// Update immediately so there's no 1-second delay
updateCountdown();
setInterval(updateCountdown, 1000);
</script>
